  --done:#2E9E8A;--done-tint:#DDF1EC;--done-text:#1F6F62;--todo:#E9B63B;--todo-tint:#FBF0D2;--todo-text:#8A6406;--sky:#4C93D6;--sky-tint:#E2EEFA;--sky-text:#2A6BAA;
  --lav:#8E80D8;--lav-tint:#ECE9FA;--lav-text:#5A4CB0;--coral:#E57F65;--coral-tint:#FCE8E2;--coral-text:#B4513A;--bad:#D2553A;--bad-tint:#FCE6E1;
  --h1:#2F8072;--h2:#1C4F47;--hero-text:#FFFFFF;--shadow:0 1px 2px rgba(34,48,44,.05),0 6px 18px rgba(34,48,44,.07);--r:18px}
[data-look=dark]{--bg:#111917;--card:#1A2421;--text:#ECF3F0;--muted:#A5B5AF;--line:#283632;--soft:#202B28;--acc:#5CC7B3;--acc-on:#111917;--acc-text:#8EE0D0;--tint:#1D3A34;
  --done:#5CC7B3;--done-tint:#1D3A34;--done-text:#8EE0D0;--todo:#F2C85A;--todo-tint:#3D3217;--todo-text:#FFD272;--sky:#7AB4F0;--sky-tint:#1B2E45;--sky-text:#A3CBF5;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:600}
h2{font-size:22px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:1040px;margin:0 auto}
header.top .logo{width:32px;height:32px;flex:none}
header.top b{font:600 19px Outfit,Inter,sans-serif;flex:1;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--acc-text);font-size:13px;font-weight:600;border:0;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}

.g-d{background:var(--done);color:#fff}.g-t{background:var(--todo-tint);color:var(--todo-text)}.g-t:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--todo)}
.search{position:relative;margin:8px 0}.search input{padding-left:38px}.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px 0 8px}
.bigtime{font:600 54px/1 Outfit,Inter,sans-serif;text-align:center;margin:6px 0 4px;letter-spacing:-.02em}
.qlist .crow{cursor:pointer}
.whos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.whos button{border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:650;color:var(--text)}
.rm{display:grid;grid-template-columns:36px 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--text)}
.rm:last-child{border-bottom:0}.rm .pbar{grid-column:2/4}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.edit-list .in{margin-bottom:6px}
@media(min-width:820px){.days{gap:10px}.dayb{padding:10px 4px}}
.hscroll .opt{flex:none;white-space:nowrap}
table.wk{table-layout:fixed}table.wk th:not(:first-child){width:30px}
table.wk td:first-child{max-width:none}
.crow .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
@media(min-width:760px){table.wk th:not(:first-child){width:58px}}

<script>/* Chore Planner app: numbers. Same rules as the spreadsheet (sheets/model.py):
   next due = last done + "how often" days (never done = start date), week Monday or Sunday, points to the person who did it. */
(function (root) {
  "use strict";
  var FREQS = [["Daily", 1], ["Every 2 days", 2], ["Twice a week", 3], ["Weekly", 7], ["Every 2 weeks", 14], ["Monthly", 30],
    ["Every 2 months", 61], ["Every 3 months", 91], ["Every 6 months", 182], ["Yearly", 365]];
  var DAYS = {}; FREQS.forEach(function (f) { DAYS[f[0]] = f[1]; });
  function d2n(iso) { var p = iso.split("-"); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function n2d(n) { var d = new Date(n * 864e5); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); }
  function addDays(iso, k) { return n2d(d2n(iso) + k); }
  function diff(a, b) { return d2n(a) - d2n(b); }
  function dow(iso) { return ((d2n(iso) % 7) + 7 + 4) % 7; } // 0 = Sunday
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function interval(f) { return DAYS[f] || 7; }
  function weekStart(asOf, ws) { var k = ws === "Sunday" ? dow(asOf) : (dow(asOf) + 6) % 7; return addDays(asOf, -k); }
  function status(n) { return n == null ? "" : n < 0 ? "Overdue" : n === 0 ? "Due today" : n === 1 ? "Tomorrow" : "In " + n + " days"; }
  function parseNum(s) { if (s == null) return null; s = String(s).trim().replace(",", "."); if (s === "") return null; var v = +s; return isFinite(v) ? v : null; }
  function index(S) { var m = {}; S.log.forEach(function (x, i) { (m[x.c] = m[x.c] || []).push(i); }); return m; }

  /* One chore on day asOf: last done, who, next due, status, done this week, and the 7-day grid (✓ done, • to do). */
  function row(S, ch, asOf, ws, idx) {
    idx = idx || index(S);
    var mine = (idx[ch.id] || []).filter(function (i) { return S.log[i].d <= asOf; }), last = null, li = -1;
    mine.forEach(function (i) { var d = S.log[i].d; if (last === null || d > last || (d === last && i > li)) { last = d; li = i; } });
    var by = li >= 0 ? S.log[li].p : null;
    if (ch.prior && (last === null || ch.prior > last)) { last = ch.prior; by = null; }
    var n = interval(ch.freq), start = S.settings.start || asOf;
    var next = last ? addDays(last, n) : start, dn = diff(next, asOf), w0 = weekStart(asOf, ws), w6 = addDays(w0, 6);
    var wEnd = w6 < asOf ? w6 : asOf, week = 0, doneOn = {};
    (idx[ch.id] || []).forEach(function (i) { var d = S.log[i].d; if (d >= w0 && d <= wEnd) week++; if (d <= asOf) doneOn[d] = 1; });
    var base = next > asOf ? next : asOf, grid = [];
    for (var k = 0; k < 7; k++) {
      var d = addDays(w0, k);
      if (d <= asOf && doneOn[d]) grid.push("✓");
      else if (d >= asOf && d >= base && diff(d, base) % n === 0) grid.push("•");
      else grid.push("");
    }
    return { last: last, by: by, interval: n, next: next, n: dn, status: status(dn), week: week, grid: grid };
  }

  /* Who does it next: a person, "any" (null) or "rotate" (the person after the last one who did it). */
  function whoNext(S, ch, idx) {
    if (ch.who === "any" || !ch.who) return null;
    if (ch.who !== "rotate") return ch.who;
    var ppl = S.people.map(function (p) { return p.id; }); if (!ppl.length) return null;
    var list = (idx || index(S))[ch.id] || [], best = -1, bd = null;
    list.forEach(function (i) { var x = S.log[i]; if (ppl.indexOf(x.p) >= 0 && (bd === null || x.d > bd || (x.d === bd && i > best))) { bd = x.d; best = i; } });
    if (best < 0) return ppl[0];
    return ppl[(ppl.indexOf(S.log[best].p) + 1) % ppl.length];
  }

  function summary(S, asOf) {
    var ws = S.settings.weekStart || "Monday", idx = index(S), o = { asOf: asOf, weekStart: weekStart(asOf, ws) };
    o.weekDays = []; for (var k = 0; k < 7; k++) o.weekDays.push(addDays(o.weekStart, k));
    var w6 = o.weekDays[6], wEnd = w6 < asOf ? w6 : asOf;
    o.rows = {}; o.dueToday = 0; o.overdue = 0; o.weekDone = 0; o.weekLeft = 0;
    var due = [];
    S.chores.forEach(function (ch, i) {
      var r = row(S, ch, asOf, ws, idx); o.rows[ch.id] = r;
      if (r.n === 0) o.dueToday++; if (r.n < 0) o.overdue++;
      r.grid.forEach(function (g) { if (g === "✓") o.weekDone++; else if (g === "•") o.weekLeft++; });
      if (r.next <= asOf) due.push([r.next, i, ch]);
    });
    o.pct = o.weekDone + o.weekLeft ? o.weekDone / (o.weekDone + o.weekLeft) : 0;
    due.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] - b[1]; });
    o.due = due.map(function (x) { return x[2]; });
    var cmap = {}; S.chores.forEach(function (c) { cmap[c.id] = c; });
    function pts(x) { var c = cmap[x.c]; return c ? (+c.pts || 0) : 0; }
    function mins(x) { var c = cmap[x.c]; return x.min != null ? x.min : (c ? (+c.min || 0) : 0); }
    o.days = [];
    for (k = 13; k >= 0; k--) { var d = addDays(asOf, -k), xs = S.log.filter(function (x) { return x.d === d; });
      o.days.push({ date: d, done: xs.length, points: xs.reduce(function (a, x) { return a + pts(x); }, 0), minutes: xs.reduce(function (a, x) { return a + mins(x); }, 0) }); }
    var m0 = asOf.slice(0, 8) + "01", inWeek = function (x) { return x.d >= o.weekStart && x.d <= wEnd; };
    o.people = S.people.map(function (p) {
      var mine = S.log.filter(function (x) { return x.p === p.id; }), wk = mine.filter(inWeek), wp = wk.reduce(function (a, x) { return a + pts(x); }, 0), g = +p.goal || 0;
      return { id: p.id, name: p.name, weekPoints: wp, weekDone: wk.length, weekMin: wk.reduce(function (a, x) { return a + mins(x); }, 0),
        monthPoints: mine.filter(function (x) { return x.d >= m0 && x.d <= asOf; }).reduce(function (a, x) { return a + pts(x); }, 0),
        allPoints: mine.filter(function (x) { return x.d <= asOf; }).reduce(function (a, x) { return a + pts(x); }, 0),
        goal: g, pct: g ? Math.min(1, wp / g) : 0, left: g ? Math.max(0, g - wp) : null, met: !!g && wp >= g, reward: p.reward || "" };
    });
    var wl = S.log.filter(inWeek);
    o.weekPoints = wl.reduce(function (a, x) { return a + pts(x); }, 0);
    o.weekMinutes = wl.reduce(function (a, x) { return a + mins(x); }, 0);
    var top = null; o.people.forEach(function (p) { if (!top || p.weekPoints > top.weekPoints) top = p; });
    o.top = top && top.weekPoints > 0 ? top.name : "";
    o.rooms = S.rooms.map(function (rm) {
      var cs = S.chores.filter(function (c) { return c.room === rm; }), od = cs.filter(function (c) { return o.rows[c.id].n < 0; }).length;
      return { room: rm, chores: cs.length, overdue: od, due: cs.filter(function (c) { return o.rows[c.id].n === 0; }).length,
        week: cs.reduce(function (a, c) { return a + o.rows[c.id].grid.filter(function (g) { return g === "✓"; }).length; }, 0), pct: cs.length ? (cs.length - od) / cs.length : null };
    });
    var rs = S.reset.filter(function (x) { return x.task; });
    o.resetTotal = rs.length; o.resetDone = rs.filter(function (x) { return x.d; }).length; o.resetPct = rs.length ? o.resetDone / rs.length : 0;
    return o;
  }

  /* Quick clean: the most overdue chores (then due today) that fit in the minutes; if none fits, the most overdue one. */
  function quick(S, asOf, minutes, o) {
    o = o || summary(S, asOf); var out = [], used = 0;
    var mm = function (c) { return c.min != null && c.min !== "" ? +c.min : 5; };
    o.due.forEach(function (c) { var m = mm(c); if (used + m <= minutes) { out.push(c); used += m; } });
    if (!out.length && o.due.length) { out.push(o.due[0]); used = mm(o.due[0]); }
    return { chores: out, minutes: used };
  }

  root.Calc = { FREQS: FREQS, d2n: d2n, n2d: n2d, addDays: addDays, diff: diff, dow: dow, byId: byId, interval: interval, weekStart: weekStart,
    status: status, parseNum: parseNum, index: index, row: row, whoNext: whoNext, summary: summary, quick: quick };
  if (typeof module !== "undefined") module.exports = root.Calc;
})(typeof window !== "undefined" ? window : this);
</script>

  function barsSVG(vals, labs, col, H) {
    var W = 320, n = vals.length, pad = 4, top = 14, bot = 18, max = Math.max(1, Math.max.apply(null, vals)) * 1.12;
    var bw = Math.min(14, (W - pad * 2) / n * 0.42), step = (W - pad * 2) / n, s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img">';
    for (var g = 0; g <= 2; g++) { var y = top + (H - top - bot) * g / 2; s += '<line class="gl" x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '"/>'; }
    vals.forEach(function (v, i) {
      var x = pad + step * i + (step - bw) / 2, hh = (H - top - bot) * v / max, y = H - bot - hh;
      if (v > 0) s += '<rect class="gb" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="' + (bw / 2).toFixed(1) + '" fill="' + col + '"/>';
      if (v > 0) s += '<text class="ax" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle" style="font-weight:700;fill:var(--text)">' + num(v) + "</text>";
      if (labs[i]) s += '<text class="ax" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(labs[i]) + "</text>";
    });

  function areaSVG(vals, labs, col, H, id) {

    var path = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
    for (var i = 1; i < pts.length; i++) { var p0 = pts[i - 1], p1 = pts[i], cx = (p0[0] + p1[0]) / 2; path += " C" + cx.toFixed(1) + "," + p0[1].toFixed(1) + " " + cx.toFixed(1) + "," + p1[1].toFixed(1) + " " + p1[0].toFixed(1) + "," + p1[1].toFixed(1); }
    var area = path + " L" + pts[pts.length - 1][0].toFixed(1) + "," + (H - bot) + " L" + pts[0][0].toFixed(1) + "," + (H - bot) + " Z";
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img"><defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".35"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>';
    for (var g = 0; g <= 2; g++) { var y = top + (H - top - bot) * g / 2; s += '<line class="gl" x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '"/>'; }
    s += '<path d="' + area + '" fill="url(#g' + id + ')"/><path class="gl2" d="' + path + '" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>';

        if (!l) { stopTimer(); view.qleft = null; quickSheet(); toast("Time is up. Great job!"); } }, 250) }; quickSheet(); }

      stopTimer(); view.qleft = null; save(); cache = null; closeSheet(); view.keep = true; render(); if (n) { confetti(); toast(plural(n, "chore") + " done in your quick clean"); } }

    else if (a === "delchore") { var dc = C.byId(S.chores, id), di = S.chores.indexOf(dc); if (!confirm("Delete " + dc.name + "? Its done history stays in the log.")) return; S.chores.splice(di, 1); save(); cache = null; closeSheet(); view.keep = true; render();
      toast("Chore deleted", function () { S.chores.splice(di, 0, dc); save(); cache = null; render(); }); }
    else if (a === "room") { view.room = v || ""; view.keep = true; render(); }

    }
  });
  document.addEventListener("input", function (e) {
    var el = e.target;

  });
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__bip = e; });
  window.addEventListener("appinstalled", function () { flag("installed"); });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { applyLook(); if (S) render(); });

  setInterval(function () { if (S && !S.sample && cache && cache.at !== today()) { cache = null; render(); } }, 60000);
